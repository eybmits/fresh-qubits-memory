[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fresh-qubits-memory"
version = "0.1.0"
description = "Reproducible calculations, simulations, and builds for fresh-qubit memory limits"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [{name = "Markus Baumann"}]
dependencies = []

[project.optional-dependencies]
paper = ["numpy>=2.0", "scipy>=1.11", "matplotlib>=3.8,!=3.11.0", "mpmath>=1.3"]
validation = ["numpy>=2.0", "scipy>=1.11", "matplotlib>=3.8", "reportlab>=4.0"]

[project.urls]
Repository = "https://github.com/eybmits/fresh-qubits-memory"

[tool.setuptools.packages.find]
where = ["src"]
