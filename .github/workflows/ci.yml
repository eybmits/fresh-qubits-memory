name: Scientific checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  majority-reproduction:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/reproduce_table1.py --output-dir results/local/ci-table1

  channel-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[validation]"
      - run: python -m unittest discover -s tests -v
      - run: MPLCONFIGDIR=work/mpl-cache OPENBLAS_NUM_THREADS=1 python scripts/validate_empirical.py --output-dir results/local/ci-empirical

  current-paper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[paper]"
      - run: python scripts/reproduce_paper.py check --output-dir results/local/ci-paper-check
      - run: python scripts/run_prl_campaign.py --smoke --output-dir results/local/ci-paper-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: current-paper-diagnostics
          path: |
            results/local/ci-paper-check/manifest.json
            results/local/ci-paper-check/logs/
            results/local/ci-paper-smoke/run_manifest.json
            results/local/ci-paper-smoke/log_*.txt

  paper-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[paper]"
      - name: Install manuscript and figure build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y texlive-latex-extra texlive-fonts-recommended texlive-publishers cm-super lmodern
      - run: python scripts/reproduce_paper.py build --output-dir results/local/ci-paper-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: paper-build-diagnostics
          path: |
            results/local/ci-paper-build/manifest.json
            results/local/ci-paper-build/logs/
            results/local/ci-paper-build/source/*.log
            results/local/ci-paper-build/source/figures/*.log
