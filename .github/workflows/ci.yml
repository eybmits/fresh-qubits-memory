name: Scientific checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  majority-reproduction:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/reproduce_table1.py --output-dir results/local/ci-table1

  channel-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[validation]"
      - run: python -m unittest discover -s tests -v
      - run: MPLCONFIGDIR=work/mpl-cache OPENBLAS_NUM_THREADS=1 python scripts/validate_empirical.py --output-dir results/local/ci-empirical
